enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @storybook/builder-vite only peer-depends on vite, so Yarn 4 may resolve it
# to the root vite. When that's swirl-components-react's vite 3 (outside the
# ^5 || ^6 || ^7 peer range), Storybook's build breaks. Giving builder-vite its
# own vite dependency fixes this without changing how anything else is hoisted.
#
# Keep this in sync with packages/swirl-components' vite devDependency.
packageExtensions:
  "@storybook/builder-vite@^10":
    dependencies:
      vite: "5.4.0"
